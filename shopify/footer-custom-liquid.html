<!--
  Knock Twice — footer for the Shopify store (product pages, cart, etc.)

  HOW TO USE
  Shopify admin → Online Store → Themes → Customize → Footer → "Custom Liquid"
  block → delete everything in it → paste this whole file → Save.

  SOURCE OF TRUTH
  This is a copy of the native footer on /shop/ (shop/index.html +
  assets/styles.css + assets/scripts.js). When the native footer changes,
  update this file and paste it into Shopify again.

  Everything is scoped under #kt-footer so the Horizon theme's own styles
  (white inputs, section grid, etc.) can't leak in and ours can't leak out.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Erica+One&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

<style>
  /* Horizon wraps this block in a page-width grid section. Take it out of
     that grid so the wave and panel run edge to edge (this was the
     straight line on each side of the footer). */
  .shopify-section:has(#kt-footer),
  .shopify-section:has(#kt-footer) > .section {
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .shopify-section:has(#kt-footer) .section-background {
    display: none !important;
  }

  /* Horizon scrolls the page inside .page-wrapper and shows its own
     scrollbar, which reads as a strip down the right edge of the blue
     footer. The native site hides the scrollbar (shop/index.html), so do
     the same here. The page still scrolls normally. */
  html,
  body,
  .page-wrapper {
    scrollbar-width: none !important;
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar,
  .page-wrapper::-webkit-scrollbar {
    display: none !important;
  }

  #kt-footer {
    /* Design system values (assets/styles.css) */
    --color-bg: #F7F2EC;
    --color-ink: #32261F;
    --color-blue: #378CDA;
    --color-green: #51B18C;
    --color-khaki: #D1C3B6;
    --color-white: #FFFFFF;
    --color-red: #FF0004;
    --font-display: 'Erica One', serif;
    --font-body: 'Instrument Sans', sans-serif;
    --font-ui: 'Handjet', sans-serif;
    --type-b1: clamp(1rem, 1.54vw, 1.125rem);
    --type-field: clamp(1rem, 1.3vw, 1.125rem);
    --type-button: clamp(1rem, 1.3vw, 1.125rem);
    --type-error: clamp(0.75rem, 1vw, 0.875rem);
    --leading-error: clamp(1.0625rem, 1.39vw, 1.25rem);
    --radius-button: 6.25rem;
    --input-height: 3.4375rem;
    --button-height: 3.4375rem;
    --footer-panel-height: 22.5rem;
    --footer-pad-x: 2.5rem;
    --content-left-mobile: 1.25rem;
    --wave-height-desktop: 6.875rem;
    --wave-height-mobile: 4rem;

    position: relative;
    width: 100%;
    overflow: hidden;
    background: var(--color-bg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: normal;
    -webkit-font-smoothing: antialiased;
  }
  #kt-footer *,
  #kt-footer *::before,
  #kt-footer *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* ── Wave + eyes ── */
  #kt-footer #monster-group {
    position: relative;
    width: 100%;
    z-index: 5;
    transform: translateY(250px);
    will-change: transform;
  }
  #kt-footer #monster-group.popped-up {
    transform: translateY(0);
    transition: transform 1800ms cubic-bezier(0.16, 1, 0.3, 1);
    transition-delay: 1.1s;
  }
  #kt-footer .monster-area {
    position: relative;
    width: 100%;
    height: var(--wave-height-desktop);
  }
  #kt-footer .wave,
  #kt-footer .monster-eyes-overlay,
  #kt-footer .monster-eyes-overlay-mobile {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    overflow: visible;
  }
  #kt-footer .monster-eyes-overlay-mobile {
    display: none;
  }
  #kt-footer .eye-blink-group {
    transform-box: fill-box;
    transform-origin: center;
  }
  #kt-footer .eye-blink-group.closing {
    transform: scaleY(0);
    transition: transform 60ms ease-in;
  }
  #kt-footer .eye-blink-group.opening {
    transform: scaleY(1);
    transition: transform 100ms ease-out;
  }

  /* ── Footer panel ── */
  #kt-footer .footer {
    position: relative;
    width: 100%;
    height: var(--footer-panel-height);
    /* No overlap: a negative margin pokes the panel's corners out past the
       wave at the left/right edges. The seam is filled by the second wave
       path instead (see the wave SVG). */
    margin-top: 0;
    background: var(--color-blue);
    display: grid;
    grid-template-columns: minmax(10rem, 1fr) minmax(20rem, 33.125rem) minmax(10rem, 1fr);
    grid-template-rows: 1fr auto auto;
    column-gap: clamp(2rem, 6vw, 6.5rem);
    row-gap: 2.375rem;
    align-items: start;
    padding: 4.25rem var(--footer-pad-x) 3rem;
    z-index: 100;
  }
  #kt-footer .footer-panel {
    display: contents;
  }
  #kt-footer .footer-links {
    display: flex;
    flex-direction: column;
    gap: 0.8125rem;
    font-family: var(--font-ui);
    font-size: var(--type-field);
    line-height: 1;
    font-weight: 400;
    font-variation-settings: 'ELGR' 1, 'ELSH' 2, 'wght' 400;
  }
  #kt-footer .footer-links--support {
    justify-self: end;
    min-width: 10rem;
  }
  #kt-footer .footer-heading {
    margin: 0 0 0.25rem;
    font-family: var(--font-body);
    font-size: var(--type-b1);
    line-height: 1;
    font-weight: 700;
    letter-spacing: normal;
    color: var(--color-bg);
    text-transform: uppercase;
  }
  #kt-footer .footer-links a {
    color: var(--color-bg);
    text-decoration: none;
  }
  #kt-footer .footer-links a:hover {
    text-decoration: underline;
  }

  /* ── Mailing list ── */
  #kt-footer .footer-newsletter {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-self: center;
    width: 100%;
  }
  #kt-footer .footer-newsletter .footer-heading {
    align-self: center;
    margin-bottom: 1rem;
    font-family: var(--font-display);
    font-size: 1.375rem;
    line-height: 1;
    font-weight: 400;
    text-align: center;
    text-transform: none;
  }
  #kt-footer .field {
    appearance: none;
    font-family: var(--font-ui);
    font-size: var(--type-field);
    font-weight: 400;
    font-variation-settings: 'ELGR' 1, 'ELSH' 2, 'wght' 400;
    line-height: normal;
    height: var(--input-height);
    border-radius: var(--radius-button);
    border: 2px solid var(--color-ink);
    background: var(--color-bg);
    color: var(--color-ink);
    box-shadow: none;
    padding: 0 1.375rem;
    width: 100%;
  }
  #kt-footer .field::placeholder {
    color: var(--color-khaki);
    opacity: 1;
  }
  #kt-footer .field:focus {
    outline: none;
    border-color: var(--color-green);
  }
  #kt-footer .footer-newsletter-input.has-error {
    color: var(--color-red);
  }
  #kt-footer .footer-newsletter-error {
    display: none;
    min-height: 1rem;
    margin-top: 0.5rem;
    font-family: var(--font-body);
    font-size: var(--type-error);
    line-height: var(--leading-error);
    color: var(--color-bg);
  }
  #kt-footer .footer-newsletter.is-error .footer-newsletter-error {
    display: block;
  }
  #kt-footer .ml-submit {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 0.5rem;
    padding: 0 4.5rem;
    height: var(--button-height);
    border-radius: var(--radius-button);
    background: var(--color-green);
    color: var(--color-bg);
    font-family: var(--font-ui);
    font-size: var(--type-button);
    font-weight: 700;
    font-variation-settings: 'ELGR' 1, 'ELSH' 2, 'wght' 700;
    letter-spacing: normal;
    text-transform: none;
    border: 2px solid transparent;
    box-shadow: none;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  /* Green outline would vanish on the blue footer, so hover goes white. */
  #kt-footer .ml-submit:hover {
    background: transparent;
    color: var(--color-white);
    border-color: var(--color-white);
  }

  /* Success state — replaces heading, field and button in place */
  #kt-footer .footer-newsletter-success {
    display: none;
    text-align: center;
    color: var(--color-bg);
  }
  #kt-footer .footer-newsletter.is-success .footer-newsletter-success {
    display: block;
  }
  #kt-footer .footer-newsletter.is-success .footer-heading,
  #kt-footer .footer-newsletter.is-success .footer-newsletter-input,
  #kt-footer .footer-newsletter.is-success .footer-newsletter-submit,
  #kt-footer .footer-newsletter.is-success .footer-newsletter-error {
    display: none;
  }
  #kt-footer .footer-newsletter-success-heading {
    font-family: var(--font-display);
    font-size: 1.375rem;
    line-height: 1;
    font-weight: 400;
    margin-bottom: 1rem;
  }
  #kt-footer .footer-newsletter-success-body {
    font-family: var(--font-body);
    font-size: var(--type-error);
    line-height: var(--leading-error);
    font-weight: 400;
  }
  #kt-footer .footer-newsletter-success-body + .footer-newsletter-success-body {
    margin-top: 1rem;
  }
  #kt-footer .footer-newsletter-reset {
    appearance: none;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
    font-weight: 700;
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  #kt-footer .footer-newsletter-reset:hover {
    text-decoration: none;
  }

  /* ── Icons + copyright ── */
  #kt-footer .footer-icons {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
  }
  #kt-footer .footer-icons a {
    display: flex;
    align-items: center;
    width: 1.25rem;
    height: 1.25rem;
  }
  #kt-footer .footer-icons img {
    width: 100%;
    height: 100%;
    display: block;
  }
  #kt-footer .footer-copyright {
    grid-column: 2;
    grid-row: 3;
    justify-self: center;
    font-family: var(--font-ui);
    font-size: var(--type-field);
    line-height: 1;
    font-weight: 400;
    color: var(--color-bg);
    font-variation-settings: 'ELGR' 1, 'ELSH' 2, 'wght' 400;
    white-space: nowrap;
  }

  /* ── Mobile (768px and below) ── */
  @media (max-width: 768px) {
    #kt-footer {
      --footer-panel-height: 26.875rem;
      --footer-pad-x: var(--content-left-mobile);
    }
    #kt-footer .monster-area {
      height: var(--wave-height-mobile);
    }
    #kt-footer .monster-eyes-overlay {
      display: none;
    }
    #kt-footer .monster-eyes-overlay-mobile {
      display: block;
    }
    #kt-footer .eye-blink-group.closing {
      transform: none;
      opacity: 0;
      transition: opacity 50ms linear;
    }
    #kt-footer .eye-blink-group.opening {
      transform: none;
      opacity: 1;
      transition: opacity 80ms linear;
    }
    #kt-footer .footer {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      gap: 1.75rem;
      align-items: stretch;
      height: auto;
      min-height: calc(var(--footer-panel-height) + env(safe-area-inset-bottom, 0px));
      padding-top: 1.875rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }
    #kt-footer .footer-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    #kt-footer .footer-links,
    #kt-footer .footer-links--support,
    #kt-footer .footer-newsletter {
      justify-self: stretch;
      width: 100%;
    }
    #kt-footer .footer-links {
      order: 1;
      gap: 0.75rem;
    }
    #kt-footer .footer-links--support {
      order: 2;
    }
    #kt-footer .footer-heading {
      margin-bottom: 0;
    }
    #kt-footer .footer-newsletter {
      order: 3;
      margin-top: 1.375rem;
    }
    #kt-footer .footer-newsletter .footer-heading {
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    #kt-footer .footer-icons {
      grid-column: 1;
      grid-row: 2;
      align-self: center;
      justify-self: center;
    }
    #kt-footer .footer-copyright {
      grid-column: 1;
      grid-row: 3;
      align-self: center;
      justify-self: center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #kt-footer #monster-group {
      transform: none;
      transition: none;
    }
  }
</style>

<div id="kt-footer">

<script>
  (function () {
    var root = document.getElementById('kt-footer');
    if (!root) return;

    var monsterGroup = root.querySelector('#monster-group');
    var monsterArea = root.querySelector('#monster-area');
    var irisR = root.querySelector('#mon-iris-r');
    var irisL = root.querySelector('#mon-iris-l');
    var irisRM = root.querySelector('#mon-iris-r-m');
    var irisLM = root.querySelector('#mon-iris-l-m');
    var blinkGroups = root.querySelectorAll('.eye-blink-group');

    // ── Wave pops up on load ──
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        monsterGroup.classList.add('popped-up');
      });
    });

    // ── Eyes follow the cursor / finger ──
    function trackIris(el, x, y, restX, restY, maxX, maxY) {
      var dx = x - restX;
      var dy = y - restY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1) {
        el.setAttribute('cx', restX);
        el.setAttribute('cy', restY);
        return;
      }
      var strength = Math.min(dist / 200, 1);
      el.setAttribute('cx', restX + (dx / dist) * maxX * 0.55 * strength);
      el.setAttribute('cy', restY + (dy / dist) * maxY * 0.28 * strength);
    }

    var raf = 0;
    var mx = 0;
    var my = 0;

    function updateEyes() {
      raf = 0;
      var r = monsterArea.getBoundingClientRect();
      if (window.innerWidth <= 768) {
        var mxm = ((mx - r.left) / r.width) * 440;
        var mym = ((my - r.top) / r.height) * 64;
        trackIris(irisRM, mxm, mym, 248.5, 62.5, 10, 3);
        trackIris(irisLM, mxm, mym, 142, 64, 10, 3);
        return;
      }
      var x = ((mx - r.left) / r.width) * 1440;
      var y = my - r.top;
      trackIris(irisR, x, y, 652.9, 49.45, 20, 5);
      trackIris(irisL, x, y, 495.41, 49.46, 20, 5);
    }

    function onPointer(x, y) {
      mx = x;
      my = y;
      if (!raf) raf = requestAnimationFrame(updateEyes);
    }

    document.addEventListener('mousemove', function (e) {
      onPointer(e.clientX, e.clientY);
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (e.touches.length) onPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // ── Blink every 2–7 seconds ──
    function blink() {
      blinkGroups.forEach(function (g) { g.classList.add('closing'); });
      setTimeout(function () {
        blinkGroups.forEach(function (g) {
          g.classList.remove('closing');
          g.classList.add('opening');
        });
        setTimeout(function () {
          blinkGroups.forEach(function (g) { g.classList.remove('opening'); });
        }, 110);
      }, 65);
    }
    (function scheduleBlink() {
      setTimeout(function () {
        blink();
        scheduleBlink();
      }, 2000 + Math.random() * 5000);
    })();

    // ── Mailing list (same copy and endpoint as assets/scripts.js) ──
    var form = root.querySelector('[data-footer-newsletter]');
    var input = form.querySelector('.footer-newsletter-input');
    var sheetUrl = 'https://script.google.com/macros/s/AKfycbyIKQkkXpe8kO5tsrhDdunKesfhD-xJGHTBSN1FhOC_Z-veuRK8fxkEbzX4_cbhmtZm/exec';
    var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    var panel = document.createElement('div');
    panel.className = 'footer-newsletter-success';
    var heading = document.createElement('p');
    heading.className = 'footer-newsletter-success-heading';
    heading.textContent = "YAY, YOU'RE OFFICIALLY A KNOCKER! 💖";
    var body = document.createElement('p');
    body.className = 'footer-newsletter-success-body';
    body.textContent = "We'll be knocking at your door (email) sometime soon! As promised, we'll never get offended if you decide to unsubscribe.";
    var again = document.createElement('p');
    again.className = 'footer-newsletter-success-body';
    again.appendChild(document.createTextNode('Used the wrong email or want to sign up with a different email, click '));
    var reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'footer-newsletter-reset';
    reset.textContent = 'here';
    again.appendChild(reset);
    again.appendChild(document.createTextNode('.'));
    panel.appendChild(heading);
    panel.appendChild(body);
    panel.appendChild(again);
    form.appendChild(panel);

    reset.addEventListener('click', function () {
      form.classList.remove('is-success');
      input.value = '';
      input.focus();
    });

    input.addEventListener('input', function () {
      form.classList.remove('is-error');
      input.classList.remove('has-error');
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var email = input.value.trim();
      if (!emailRe.test(email)) {
        form.classList.add('is-error');
        form.classList.remove('is-success');
        input.classList.add('has-error');
        return;
      }
      form.classList.remove('is-error');
      input.classList.remove('has-error');
      form.classList.add('is-success');
      fetch(sheetUrl + '?email=' + encodeURIComponent(email), { mode: 'no-cors' })
        .catch(function () {});
    });
  })();
</script>
